name: PR flow labels

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - converted_to_draft
      - closed
    branches:
      - main

# Everything is done with the windhawk-reviewer app token, so the workflow token
# only needs to check out the base branch. Nothing from the pull request itself
# is checked out or run.
permissions:
  contents: read

# One run at a time per pull request, so that two events don't act on the same
# labels at once. Runs aren't cancelled, so that one isn't stopped between adding
# the new label and removing the old one.
concurrency:
  group: pr-flow-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Forks don't inherit the upstream GitHub App private key. Keep it in an
      # environment variable so app-dependent steps can be skipped cleanly.
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Only the flow script is needed, so the mod sources are skipped.
          sparse-checkout: .github

      - name: Generate an app token
        if: env.BOT_APP_PRIVATE_KEY != ''
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # The windhawk-reviewer app.
          app-id: '4425681'
          private-key: ${{ env.BOT_APP_PRIVATE_KEY }}

      - name: Update the flow label
        if: env.BOT_APP_PRIVATE_KEY != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          # A transient 5xx would otherwise fail the run halfway through a label
          # change. 4xx codes stay exempt, so removeLabels still sees its 404.
          retries: 3
          script: |
            const flow = require('${{ github.workspace }}/.github/pr_flow.cjs');
            await flow.handlePullRequestEvent({ github, context, core });

      - name: Skip reviewer flow without app credentials
        if: env.BOT_APP_PRIVATE_KEY == ''
        run: echo "Skipping PR flow labels because BOT_APP_PRIVATE_KEY is not configured in this fork."
